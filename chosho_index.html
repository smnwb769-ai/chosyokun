<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>チョウショ君 腸活診断</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;background:linear-gradient(135deg,#e8f5e9 0%,#f1f8e9 50%,#e0f2f1 100%);min-height:100vh;color:#2e7d32;-webkit-tap-highlight-color:transparent}
  .container{max-width:680px;margin:0 auto;padding:14px 14px 40px}
  .header{text-align:center;padding:18px 0 10px}
  .app-title{font-size:1.7rem;font-weight:900;color:#2e7d32;letter-spacing:-0.5px}
  .app-sub{font-size:.85rem;color:#66bb6a;font-weight:600;margin-top:3px}
  .chara-wrap{display:flex;justify-content:center;margin:6px 0 16px}
  .chara-svg{width:95px;height:95px;filter:drop-shadow(0 6px 16px rgba(102,187,106,.35));transition:all .4s}
  .card{background:#fff;border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 4px 20px rgba(46,125,50,.08)}
  .api-row{display:flex;gap:8px;align-items:center}
  .api-row input{flex:1;border:2px solid #a5d6a7;border-radius:12px;padding:12px 14px;font-family:inherit;font-size:1rem;outline:none;transition:border .2s;min-height:48px}
  .api-row input:focus{border-color:#66bb6a}
  .save-btn{background:#66bb6a;color:#fff;border:none;border-radius:12px;padding:12px 16px;font-family:inherit;font-weight:700;cursor:pointer;white-space:nowrap;font-size:.95rem;min-height:48px;min-width:64px}
  .save-btn:active{background:#43a047}
  .api-saved{color:#43a047;font-size:.82rem;font-weight:700;margin-top:6px}
  .section-toggle{display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;padding:2px 0}
  .section-title{font-size:1rem;font-weight:800;color:#388e3c}
  .toggle-icon{font-size:1rem;transition:transform .3s;color:#66bb6a}
  .toggle-icon.open{transform:rotate(180deg)}
  .collapse-body{overflow:hidden;max-height:0;transition:max-height .35s ease}
  .collapse-body.open{max-height:300px}
  .profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  label{font-size:.82rem;font-weight:700;color:#558b2f;display:block;margin-bottom:5px}
  select,input[type=text],textarea{width:100%;border:2px solid #c8e6c9;border-radius:12px;padding:12px 12px;font-family:inherit;font-size:1rem;outline:none;background:#fff;transition:border .2s;min-height:48px}
  select:focus,input[type=text]:focus,textarea:focus{border-color:#66bb6a}
  .tabs{display:flex;gap:6px;margin-bottom:14px}
  .tab{flex:1;padding:12px 6px;border:2.5px solid #c8e6c9;border-radius:14px;background:#f9fbe7;font-family:inherit;font-weight:800;font-size:.85rem;color:#7cb342;cursor:pointer;text-align:center;transition:all .2s;min-height:48px;display:flex;align-items:center;justify-content:center}
  .tab.active{background:#66bb6a;color:#fff;border-color:#66bb6a;box-shadow:0 3px 12px rgba(102,187,106,.35)}
  .tab:active{opacity:.85}
  .meal-panel{display:none}
  .meal-panel.active{display:block}
  textarea{resize:vertical;min-height:90px;line-height:1.6}
  .diag-btn{width:100%;padding:18px;background:linear-gradient(135deg,#66bb6a,#43a047);color:#fff;border:none;border-radius:18px;font-family:inherit;font-weight:900;font-size:1.15rem;cursor:pointer;box-shadow:0 6px 24px rgba(67,160,71,.35);transition:all .2s;letter-spacing:.5px;min-height:58px}
  .diag-btn:active{transform:scale(.98);box-shadow:0 3px 14px rgba(67,160,71,.3)}
  .diag-btn:disabled{background:#ccc;box-shadow:none;transform:none;cursor:not-allowed}
  .loading{text-align:center;padding:30px;display:none}
  .spinner{width:44px;height:44px;border:5px solid #c8e6c9;border-top-color:#66bb6a;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading p{font-weight:700;color:#66bb6a;font-size:.95rem}
  .results{display:none}
  .score-ring-wrap{text-align:center;margin:8px 0 20px}
  .score-ring{display:inline-block;width:120px;height:120px;position:relative}
  .score-ring svg{transform:rotate(-90deg)}
  .ring-bg{fill:none;stroke:#e8f5e9;stroke-width:12}
  .ring-fg{fill:none;stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .8s ease}
  .score-num{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
  .score-num .num{font-size:1.9rem;font-weight:900;line-height:1}
  .score-num .lbl{font-size:.68rem;font-weight:700;color:#66bb6a}
  .score-label{font-size:.95rem;font-weight:800;margin-top:8px;color:#2e7d32}
  .cat-title{font-size:.92rem;font-weight:800;color:#388e3c;margin-bottom:12px}
  .bar-row{margin-bottom:13px}
  .bar-meta{display:flex;justify-content:space-between;font-size:.82rem;font-weight:700;color:#558b2f;margin-bottom:5px}
  .bar-track{background:#e8f5e9;border-radius:99px;height:14px;overflow:hidden}
  .bar-fill{height:100%;border-radius:99px;transition:width .8s ease}
  .advice-tabs{display:flex;gap:6px;margin-bottom:12px}
  .adv-tab{flex:1;padding:10px 4px;border:2px solid #c8e6c9;border-radius:12px;background:#f9fbe7;font-family:inherit;font-weight:800;font-size:.82rem;color:#7cb342;cursor:pointer;text-align:center;transition:all .2s;min-height:44px;display:flex;align-items:center;justify-content:center}
  .adv-tab.active{background:#66bb6a;color:#fff;border-color:#66bb6a}
  .adv-tab:active{opacity:.85}
  .adv-panel{display:none;font-size:.9rem;line-height:1.75;color:#33691e;background:#f1f8e9;border-radius:14px;padding:14px}
  .adv-panel.active{display:block}
  .imp-list{list-style:none}
  .imp-list li{background:#f9fbe7;border-left:4px solid #66bb6a;border-radius:0 12px 12px 0;padding:12px 14px;margin-bottom:10px;font-size:.9rem;line-height:1.65;color:#33691e}
  .error-box{background:#fff3e0;border:2px solid #ffb74d;border-radius:14px;padding:14px;color:#e65100;font-size:.88rem;font-weight:700;margin-top:12px;display:none;line-height:1.5}
  .divider{height:1px;background:#e8f5e9;margin:10px 0 14px}
  .results-card-title{font-size:.95rem;font-weight:800;color:#388e3c;margin-bottom:12px}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="app-title">🦠 チョウショ君</div>
    <div class="app-sub">あなたの腸活スコアを診断！</div>
  </div>
  <div class="chara-wrap">
    <svg class="chara-svg" id="charasvg" viewBox="0 0 110 110" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="55" cy="60" rx="38" ry="44" fill="#a5d6a7"/>
      <ellipse cx="55" cy="58" rx="34" ry="40" fill="#c8e6c9"/>
      <ellipse cx="43" cy="42" rx="8" ry="5" fill="white" opacity=".45" transform="rotate(-20 43 42)"/>
      <circle cx="43" cy="54" r="9" fill="white"/>
      <circle cx="67" cy="54" r="9" fill="white"/>
      <circle id="pupL" cx="45" cy="55" r="5.5" fill="#2e7d32"/>
      <circle id="pupR" cx="69" cy="55" r="5.5" fill="#2e7d32"/>
      <circle cx="46.5" cy="53.5" r="2" fill="white"/>
      <circle cx="70.5" cy="53.5" r="2" fill="white"/>
      <ellipse cx="33" cy="63" rx="7" ry="4" fill="#f48fb1" opacity=".5"/>
      <ellipse cx="77" cy="63" rx="7" ry="4" fill="#f48fb1" opacity=".5"/>
      <path id="mouth" d="M45 70 Q55 76 65 70" stroke="#388e3c" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <line x1="22" y1="50" x2="15" y2="43" stroke="#81c784" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="20" y1="60" x2="12" y2="57" stroke="#81c784" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="88" y1="50" x2="95" y2="43" stroke="#81c784" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="90" y1="60" x2="98" y2="57" stroke="#81c784" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="55" y1="16" x2="55" y2="8" stroke="#81c784" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="43" y1="18" x2="39" y2="11" stroke="#81c784" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="67" y1="18" x2="71" y2="11" stroke="#81c784" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="card">
    <div class="section-title" style="margin-bottom:12px">🔑 APIキー設定</div>
    <div class="api-row">
      <input type="password" id="apiKeyInput" placeholder="sk-ant-..." autocomplete="off"/>
      <button class="save-btn" onclick="saveApiKey()">保存</button>
    </div>
    <div class="api-saved" id="apiSaved" style="display:none">✅ 保存しました</div>
  </div>
  <div class="card">
    <div class="section-toggle" onclick="toggleProfile()">
      <span class="section-title">👤 プロフィール（任意）</span>
      <span class="toggle-icon" id="profileIcon">▼</span>
    </div>
    <div class="collapse-body" id="profileBody">
      <div class="profile-grid">
        <div>
          <label>性別</label>
          <select id="gender">
            <option value="">未選択</option>
            <option>男性</option><option>女性</option><option>その他</option>
          </select>
        </div>
        <div>
          <label>年代</label>
          <select id="age">
            <option value="">未選択</option>
            <option>10代</option><option>20代</option><option>30代</option>
            <option>40代</option><option>50代</option><option>60代以上</option>
          </select>
        </div>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="section-title" style="margin-bottom:14px">🍽️ 今日の食事を入力</div>
    <div class="tabs">
      <button class="tab active" onclick="switchMeal('morning',this)">🌅 朝食</button>
      <button class="tab" onclick="switchMeal('lunch',this)">☀️ 昼食</button>
      <button class="tab" onclick="switchMeal('dinner',this)">🌙 夕食</button>
    </div>
    <div class="meal-panel active" id="panel-morning">
      <label>朝食に食べたものを入力</label>
      <textarea id="meal-morning" placeholder="例：納豆ご飯、味噌汁、バナナ、ヨーグルト"></textarea>
    </div>
    <div class="meal-panel" id="panel-lunch">
      <label>昼食に食べたものを入力</label>
      <textarea id="meal-lunch" placeholder="例：サバ味噌定食、りんご"></textarea>
    </div>
    <div class="meal-panel" id="panel-dinner">
      <label>夕食に食べたものを入力</label>
      <textarea id="meal-dinner" placeholder="例：鶏むね肉炒め、玄米、キムチ"></textarea>
    </div>
  </div>
  <button class="diag-btn" id="diagBtn" onclick="diagnose()">🔬 腸活診断する！</button>
  <div class="error-box" id="errorBox"></div>
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>チョウショ君が分析中...🦠</p>
  </div>
  <div class="results" id="results">
    <div class="card" style="margin-top:18px">
      <div class="results-card-title" style="text-align:center">総合腸活スコア</div>
      <div class="score-ring-wrap">
        <div class="score-ring">
          <svg viewBox="0 0 120 120" width="120" height="120">
            <circle class="ring-bg" cx="60" cy="60" r="50"/>
            <circle class="ring-fg" id="ringFg" cx="60" cy="60" r="50"
              stroke-dasharray="314.2" stroke-dashoffset="314.2" stroke="#66bb6a"/>
          </svg>
          <div class="score-num">
            <div class="num" id="scoreNum" style="color:#2e7d32">--</div>
            <div class="lbl">/ 100</div>
          </div>
        </div>
        <div class="score-label" id="scoreLabel"></div>
      </div>
      <div class="divider"></div>
      <div class="cat-title">📊 カテゴリ別スコア</div>
      <div id="catBars"></div>
    </div>
    <div class="card">
      <div class="results-card-title">💬 時間帯別アドバイス</div>
      <div class="advice-tabs">
        <button class="adv-tab active" onclick="switchAdv('adv-morning',this)">🌅 朝</button>
        <button class="adv-tab" onclick="switchAdv('adv-lunch',this)">☀️ 昼</button>
        <button class="adv-tab" onclick="switchAdv('adv-dinner',this)">🌙 夜</button>
      </div>
      <div class="adv-panel active" id="adv-morning"></div>
      <div class="adv-panel" id="adv-lunch"></div>
      <div class="adv-panel" id="adv-dinner"></div>
    </div>
    <div class="card">
      <div class="results-card-title">🌱 改善ポイント</div>
      <ul class="imp-list" id="impList"></ul>
    </div>
  </div>
</div>
<script>
let savedApiKey='';
function saveApiKey(){
  const v=document.getElementById('apiKeyInput').value.trim();
  if(!v){alert('APIキーを入力してください');return;}
  savedApiKey=v;
  document.getElementById('apiSaved').style.display='block';
}
function toggleProfile(){
  document.getElementById('profileBody').classList.toggle('open');
  document.getElementById('profileIcon').classList.toggle('open');
}
function switchMeal(id,btn){
  document.querySelectorAll('.meal-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('panel-'+id).classList.add('active');
  btn.classList.add('active');
}
function switchAdv(id,btn){
  document.querySelectorAll('.adv-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.adv-tab').forEach(b=>b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
}
function setChara(score){
  const m=document.getElementById('mouth');
  const pL=document.getElementById('pupL');
  const pR=document.getElementById('pupR');
  if(score>=75){
    m.setAttribute('d','M43 69 Q55 80 67 69');
    pL.setAttribute('cy','53');pR.setAttribute('cy','53');
  } else if(score>=50){
    m.setAttribute('d','M45 70 Q55 76 65 70');
    pL.setAttribute('cy','55');pR.setAttribute('cy','55');
  } else {
    m.setAttribute('d','M43 74 Q55 67 67 74');
    pL.setAttribute('cy','57');pR.setAttribute('cy','57');
  }
}
function animateRing(score){
  const circ=314.2;
  const offset=circ-(circ*score/100);
  const el=document.getElementById('ringFg');
  const color=score>=75?'#43a047':score>=50?'#ffa726':'#ef5350';
  el.style.stroke=color;
  setTimeout(()=>{el.style.strokeDashoffset=offset;},100);
  let cur=0;
  const iv=setInterval(()=>{
    cur=Math.min(cur+2,score);
    document.getElementById('scoreNum').textContent=cur;
    document.getElementById('scoreNum').style.color=color;
    if(cur>=score)clearInterval(iv);
  },18);
}
function renderCatBars(cats){
  const colors=['#66bb6a','#26c6da','#ffa726','#ab47bc'];
  const c=document.getElementById('catBars');
  c.innerHTML='';
  cats.forEach((cat,i)=>{
    const pct=Math.max(0,Math.min(100,cat.score));
    c.innerHTML+=`<div class="bar-row">
      <div class="bar-meta"><span>${cat.name}</span><span>${pct}点</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:0%;background:${colors[i%colors.length]}" data-w="${pct}%"></div></div>
    </div>`;
  });
  setTimeout(()=>{
    document.querySelectorAll('.bar-fill').forEach(b=>{b.style.width=b.dataset.w;});
  },100);
}
async function diagnose(){
  const apiKey=savedApiKey||document.getElementById('apiKeyInput').value.trim();
  if(!apiKey){showError('APIキーを入力・保存してください。');return;}
  const morning=document.getElementById('meal-morning').value.trim();
  const lunch=document.getElementById('meal-lunch').value.trim();
  const dinner=document.getElementById('meal-dinner').value.trim();
  if(!morning&&!lunch&&!dinner){showError('少なくとも1食分の食事を入力してください。');return;}
  const gender=document.getElementById('gender').value;
  const age=document.getElementById('age').value;
  hideError();
  document.getElementById('loading').style.display='block';
  document.getElementById('results').style.display='none';
  document.getElementById('diagBtn').disabled=true;
  const profile=[gender,age].filter(Boolean).join('、');
  const prompt=`あなたは腸活専門の栄養アドバイザーです。以下の食事内容を分析し、腸活スコアをJSON形式のみで返してください。\n${profile?`【プロフィール】${profile}`:''}\n【朝食】${morning||'（未入力）'}\n【昼食】${lunch||'（未入力）'}\n【夕食】${dinner||'（未入力）'}\n以下のJSON構造のみを返してください（マークダウン・説明文は一切不要）:\n{"totalScore":数値(0-100),"scoreLabel":"一言ラベル","categories":[{"name":"食物繊維","score":数値},{"name":"発酵食品","score":数値},{"name":"タンパク質","score":数値},{"name":"脂質バランス","score":数値}],"advice":{"morning":"朝アドバイス","lunch":"昼アドバイス","dinner":"夜アドバイス"},"improvements":["改善1","改善2","改善3"]}`;
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key':apiKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:prompt}]})
    });
    if(!res.ok){const err=await res.json().catch(()=>({}));throw new Error(err.error?.message||`APIエラー: ${res.status}`);}
    const data=await res.json();
    let text=data.content.map(b=>b.text||'').join('');
    text=text.replace(/```json|```/g,'').trim();
    const result=JSON.parse(text);
    document.getElementById('loading').style.display='none';
    document.getElementById('results').style.display='block';
    const score=Math.round(result.totalScore);
    animateRing(score);setChara(score);
    document.getElementById('scoreLabel').textContent=result.scoreLabel||'';
    renderCatBars(result.categories||[]);
    document.getElementById('adv-morning').textContent=result.advice?.morning||'';
    document.getElementById('adv-lunch').textContent=result.advice?.lunch||'';
    document.getElementById('adv-dinner').textContent=result.advice?.dinner||'';
    const imp=document.getElementById('impList');
    imp.innerHTML='';
    (result.improvements||[]).forEach(p=>{imp.innerHTML+=`<li>${p}</li>`;});
    document.getElementById('results').scrollIntoView({behavior:'smooth',block:'start'});
  }catch(e){
    document.getElementById('loading').style.display='none';
    showError('エラーが発生しました: '+e.message);
  }finally{
    document.getElementById('diagBtn').disabled=false;
  }
}
function showError(msg){const el=document.getElementById('errorBox');el.textContent=msg;el.style.display='block';}
function hideError(){document.getElementById('errorBox').style.display='none';}
</script>
</body>
</html>
